<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开学汇报 · 云边协同研究 · 刘泽</title>
<link rel="icon" href="../search/assets/favicon.svg" type="image/svg+xml">
<script src="../search/assets/site.js"></script>
<style>
  :root {
    --bg: #0f2f5c; --slide-bg: #fff; --primary: #1a478a; --accent: #2e7d32;
    --text: #222; --muted: #666; --border: #dde3ea; --gold: #c9a227;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: "Segoe UI", "Microsoft YaHei", "SimSun", serif; background: var(--bg); color: var(--text); }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 48px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; background: rgba(15,47,92,.97);
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .topbar .brand { color: #fff; font-weight: 700; font-size: .86rem; text-decoration: none; }
  .topbar .ctrl { display: flex; align-items: center; gap: 8px; }
  .topbar button, .topbar a.btn-mini {
    background: rgba(255,255,255,.12); border: none; color: #fff;
    padding: 6px 12px; border-radius: 6px; font-size: .76rem; font-weight: 600;
    cursor: pointer; text-decoration: none;
  }
  .topbar button:hover, .topbar a.btn-mini:hover { background: rgba(255,255,255,.22); }
  .topbar button.on { background: var(--accent); }
  .progress-wrap { flex: 1; max-width: 240px; height: 3px; background: rgba(255,255,255,.15); border-radius: 2px; margin: 0 14px; }
  .progress-bar { height: 100%; background: var(--gold); border-radius: 2px; transition: width .25s; width: 0; }
  .slide-counter { color: rgba(255,255,255,.75); font-size: .76rem; min-width: 52px; text-align: right; }

  .layout {
    position: fixed; inset: 48px 0 56px 0;
    display: flex; align-items: stretch; justify-content: center;
    padding: 14px; gap: 14px;
  }
  .deck-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
  .slide {
    display: none; width: min(920px, 100%); max-height: 100%; overflow-y: auto;
    background: var(--slide-bg); border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    padding: 36px 44px 32px; position: relative;
    animation: fadeIn .25s ease;
  }
  .slide.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .slide.tag-cover {
    background: linear-gradient(160deg, #0f2f5c, #1a478a 60%, #2563b0);
    color: #fff; text-align: center; padding: 52px 44px;
  }
  .slide.tag-cover .slide-no { color: rgba(255,255,255,.5); }
  .slide.tag-cover h1 { font-size: clamp(1.5rem, 3.5vw, 2rem); line-height: 1.45; font-weight: 800; letter-spacing: .02em; }
  .slide.tag-cover .sub { opacity: .9; margin-top: 18px; font-size: 1rem; line-height: 1.65; }
  .slide.tag-cover .footer { margin-top: 32px; opacity: .65; font-size: .86rem; }

  .slide-no {
    position: absolute; top: 14px; right: 18px;
    font-size: .72rem; color: var(--muted); font-weight: 600;
  }
  .slide h2 {
    font-size: 1.35rem; color: var(--primary); margin-bottom: 16px;
    padding-bottom: 8px; border-bottom: 2px solid var(--accent);
    font-weight: 800; letter-spacing: .03em;
  }
  .slide .lead {
    font-size: .94rem; line-height: 1.75; color: #333; margin-bottom: 14px;
    padding: 10px 14px; background: #f8fafc; border-left: 3px solid var(--primary);
  }
  .slide ul { padding-left: 1.3rem; margin: 8px 0; }
  .slide li { font-size: .9rem; line-height: 1.75; margin-bottom: 7px; color: #333; }
  .slide .formula {
    text-align: center; padding: 12px; margin: 14px 0;
    background: #eef5ff; border: 1px solid #bbdefb; border-radius: 6px;
    font-weight: 700; color: var(--primary); font-size: .92rem;
  }
  .slide table { width: 100%; border-collapse: collapse; font-size: .78rem; margin: 10px 0; }
  .slide th, .slide td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; line-height: 1.5; }
  .slide th { background: #e8eef5; color: var(--primary); font-weight: 700; }
  .slide tr.highlight td { background: #f1f8f4; }
  .grid2 { display: grid; gap: 10px; }
  @media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  .grid3 { display: grid; gap: 10px; }
  @media (min-width: 700px) { .grid3 { grid-template-columns: 1fr 1fr 1fr; } }
  .card {
    border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; background: #fafbfc;
  }
  .card h4 { font-size: .84rem; color: var(--primary); margin-bottom: 6px; font-weight: 700; }
  .card p, .card li { font-size: .8rem; line-height: 1.55; color: #555; }
  .card ul { padding-left: 1rem; margin-top: 4px; }
  .tag { display: inline-block; font-size: .65rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #e3f2fd; color: #1565c0; margin-bottom: 6px; }
  .q-item { margin-bottom: 10px; padding: 10px 12px; border: 1px solid #bbdefb; border-radius: 6px; background: #f5f9ff; }
  .q-item strong { color: var(--primary); font-size: .82rem; }
  .q-item p { font-size: .84rem; line-height: 1.6; margin-top: 4px; color: #444; }
  .questions li { list-style: none; margin-left: 0; padding: 12px 14px; margin-bottom: 8px; border-left: 4px solid var(--primary); background: #f5f9ff; font-size: .88rem; line-height: 1.65; }

  .notes-panel {
    width: 320px; flex-shrink: 0; background: #fff; border-radius: 6px;
    box-shadow: 0 8px 32px rgba(0,0,0,.2); display: none;
    flex-direction: column; overflow: hidden;
  }
  .notes-panel.show { display: flex; }
  .notes-head {
    padding: 10px 14px; background: var(--primary); color: #fff;
    font-size: .8rem; font-weight: 700;
  }
  .notes-body {
    padding: 14px; overflow-y: auto; flex: 1;
    font-size: .84rem; line-height: 1.75; color: #333;
  }
  .notes-body a { color: var(--primary); }
  .notes-hint { font-size: .72rem; color: var(--muted); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }

  .bottombar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; height: 56px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    background: rgba(15,47,92,.97); border-top: 1px solid rgba(255,255,255,.08);
  }
  .bottombar button {
    background: #2563b0; border: none; color: #fff; padding: 10px 22px;
    border-radius: 6px; font-size: .86rem; font-weight: 700; cursor: pointer;
  }
  .bottombar button:disabled { opacity: .35; cursor: default; }
  .bottombar button.ghost { background: rgba(255,255,255,.12); }
  .bottombar .hint { color: rgba(255,255,255,.55); font-size: .72rem; }

  @media (max-width: 900px) {
    .notes-panel { position: fixed; right: 8px; top: 56px; bottom: 64px; width: min(300px, 90vw); z-index: 150; }
    .layout { padding: 8px; }
  }
  @media print {
    html, body { height: auto; overflow: visible; background: #fff; }
    .topbar, .bottombar, .notes-panel { display: none !important; }
    .layout { position: static; inset: auto; display: block; padding: 0; }
    .slide { display: block !important; page-break-after: always; box-shadow: none; border: 1px solid #ccc; margin-bottom: 16px; max-height: none; }
    .slide.tag-cover { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="../start.html">← EdgeNexus</a>
  <div class="progress-wrap"><div class="progress-bar" id="progress"></div></div>
  <span class="slide-counter" id="counter">1 / 18</span>
  <div class="ctrl">
    <button type="button" id="btnNotes" title="演讲稿 N">演讲稿 N</button>
    <a class="btn-mini" href="汇报文稿.md" target="_blank" rel="noopener">全文稿</a>
    <button type="button" onclick="window.print()">打印 PDF</button>
  </div>
</div>

<div class="layout">
  <div class="deck-wrap"><div id="deck"></div></div>
  <aside class="notes-panel" id="notesPanel">
    <div class="notes-head">本页演讲稿 · 按 N 切换</div>
    <div class="notes-body" id="notesBody"></div>
  </aside>
</div>

<div class="bottombar">
  <button type="button" class="ghost" id="btnPrev" disabled>← 上一页</button>
  <span class="hint">← → 翻页</span>
  <button type="button" id="btnNext">下一页 →</button>
</div>

<script>
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderSlide(s, i, total) {
  const isCover = s.type === 'cover';
  const cls = 'slide' + (isCover ? ' tag-cover' : '') + (i === 0 ? ' active' : '');
  let inner = '';

  if (isCover) {
    inner = `
      <p class="slide-no">${i + 1} / ${total}</p>
      <p style="opacity:.75;font-size:.82rem;letter-spacing:.15em;margin-bottom:12px">开学工作汇报</p>
      <h1>${esc(s.heading).replace(/\n/g, '<br>')}</h1>
      ${s.sub ? `<p class="sub">${esc(s.sub).replace(/\n/g, '<br>')}</p>` : ''}
      ${s.footer ? `<p class="footer">${esc(s.footer)}</p>` : ''}`;
  } else {
    inner = `<p class="slide-no">${i + 1} / ${total}</p><h2>${esc(s.heading)}</h2>`;
    if (s.lead) inner += `<p class="lead">${esc(s.lead)}</p>`;
    if (s.formula) inner += `<div class="formula">${esc(s.formula)}</div>`;
    if (s.bullets?.length) {
      inner += `<ul>${s.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>`;
    }
    if (s.table) {
      inner += `<table><thead><tr>${s.table.headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>`;
      for (const row of s.table.rows) {
        const hl = row.some(c => String(c).includes('−49') || String(c).includes('0 MB')) ? ' class="highlight"' : '';
        inner += `<tr${hl}>${row.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`;
      }
      inner += `</tbody></table>`;
    }
    if (s.cards?.length) {
      inner += `<div class="grid2">${s.cards.map(c =>
        `<div class="card"><h4>${esc(c.title)}</h4><p>${esc(c.text)}</p></div>`).join('')}</div>`;
    }
    if (s.grid2?.length) {
      inner += `<div class="grid2">${s.grid2.map(g =>
        `<div class="card"><h4>${esc(g.title)}</h4><ul>${(g.items||[]).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
    }
    if (s.grid3?.length) {
      inner += `<div class="grid3">${s.grid3.map(g =>
        `<div class="card">${g.tag ? `<span class="tag">${esc(g.tag)}</span>` : ''}<h4>${esc(g.title)}</h4><ul>${(g.items||[]).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
    }
    if (s.questions?.length) {
      inner += `<ol class="questions">${s.questions.map((q, j) => `<li><strong>问题 ${j + 1}.</strong> ${esc(q)}</li>`).join('')}</ol>`;
    }
    if (s.qa?.length) {
      inner += s.qa.map(x => `<div class="q-item"><strong>问：${esc(x.q)}</strong><p>答：${esc(x.a)}</p></div>`).join('');
    }
    if (s.footer) inner += `<p style="margin-top:12px;font-size:.78rem;color:var(--muted)">${esc(s.footer)}</p>`;
  }
  return `<section class="${cls}" data-id="${s.id}" data-title="${esc(s.title)}">${inner}</section>`;
}

let slides = [], scripts = {}, cur = 0, notesOn = false;

async function main() {
  const deck = document.getElementById('deck');
  try {
    const [sd, sc] = await Promise.all([
      fetch('slides.json?_=' + Date.now()).then(r => r.json()),
      fetch('scripts.json?_=' + Date.now()).then(r => r.json()),
    ]);
    slides = sd.slides || [];
    scripts = sc;
    deck.innerHTML = slides.map((s, i) => renderSlide(s, i, slides.length)).join('');
    document.title = (sd.meta?.title || '开学汇报') + ' · 刘泽';
    go(0);
  } catch (e) {
    deck.innerHTML = '<p style="color:#c62828;padding:20px">无法加载 slides.json，请用本地服务打开 briefing/</p>';
  }
}

function getSlideEls() { return [...document.querySelectorAll('.slide')]; }

function updateNotes() {
  const s = slides[cur];
  const body = document.getElementById('notesBody');
  let html = esc(scripts[String(s?.id)] || s?.note || '（本页无备注，详见全文稿）');
  html += `<p class="notes-hint">完整版：<a href="汇报文稿.md" target="_blank" rel="noopener">汇报文稿.md</a></p>`;
  body.innerHTML = html.replace(/\n/g, '<br>');
}

function go(n) {
  const els = getSlideEls();
  if (n < 0 || n >= els.length) return;
  els[cur]?.classList.remove('active');
  cur = n;
  els[cur].classList.add('active');
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + els.length;
  document.getElementById('progress').style.width = ((cur + 1) / els.length * 100) + '%';
  document.getElementById('btnPrev').disabled = cur === 0;
  document.getElementById('btnNext').disabled = cur === els.length - 1;
  els[cur].scrollTop = 0;
  updateNotes();
}

document.getElementById('btnPrev').onclick = () => go(cur - 1);
document.getElementById('btnNext').onclick = () => go(cur + 1);

document.getElementById('btnNotes').onclick = () => {
  notesOn = !notesOn;
  document.getElementById('notesPanel').classList.toggle('show', notesOn);
  document.getElementById('btnNotes').classList.toggle('on', notesOn);
};

document.addEventListener('keydown', e => {
  if (e.key === 'n' || e.key === 'N') {
    document.getElementById('btnNotes').click();
    return;
  }
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
  if (e.key === 'Home') go(0);
  if (e.key === 'End') go(slides.length - 1);
});

main();
</script>
</body>
</html>
